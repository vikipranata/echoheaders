apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echoheaders
  namespace: default
  labels:
    app: echoheaders
spec:
  ingressClassName: traefik
  rules:
    - host: echo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: echoheaders
                port:
                  number: 80
