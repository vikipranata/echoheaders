services:
  echoheaders:
    image: vikipranata/echoheaders:latest
    container_name: echoheaders
    cap_add:
      - NET_RAW
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RATE_LIMIT_DNS=10
      - RATE_LIMIT_PING=10
      - RATE_LIMIT_TRACEROUTE=10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s