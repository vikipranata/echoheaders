name: EchoHeaders Site & Helm Repository

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Helm
        uses: helm/setup-helm@v3

      - name: Build helm repo
        shell: bash
        run: |
          set -euo pipefail
          chmod +x charts/build.sh
          ./charts/build.sh
          test -s charts/index.yaml
          compgen -G "charts/echoheaders-*.tgz" > /dev/null

      - name: Prepare site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/charts
          install -m 0644 index.html public/index.html
          install -m 0644 charts/index.yaml public/charts/index.yaml
          cp charts/echoheaders-*.tgz public/charts/

          test -s public/index.html
          test -s public/charts/index.yaml
          compgen -G "public/charts/echoheaders-*.tgz" > /dev/null

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
